<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Проверка пароля</title>
  <style>
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #1a1a1a;
      color: #fff;
      font-family: sans-serif;
    }
    .container {
      text-align: center;
    }
    #passwordInput {
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #444;
      border-radius: 4px;
      background-color: #2a2a2a;
      color: #fff;
    }
    #startBtn {
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
      background-color: #c00;
      color: white;
      border: none;
      border-radius: 4px;
    }
    #scareScreen {
      display: none; /* Скрыт по умолчанию */
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }
    #scareImage {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Картинка заполняет весь экран */
    }
    #closeBtn {
      display: none; /* Кнопка выхода скрыта изначально */
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 15px 30px;
      font-size: 18px;
      cursor: pointer;
      background-color: #fff;
      color: #000;
      border: none;
      border-radius: 8px;
      z-index: 10000;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Введите пароль для просмотра</h1>
    <input type="password" id="passwordInput" placeholder="Пароль">
    <br>
    <button id="startBtn">Посмотреть</button>
  </div>

  <!-- Экран скримера -->
  <div id="scareScreen">
    <img id="scareImage" src="" alt="scary image">
    <button id="closeBtn">Закрыть</button>
  </div>

  // --- НАСТРОЙКИ ---
  const CORRECT_PASSWORD = 'youareidiot'; // ← пароль (тот же)
  const IMAGES = [
    'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQGl2GIO4UZLKiOC4UqzxsJXaKB4AEDC0c0i2BLcOdz2OrQKyWI4EhtMBI&s=10',
    'https://alpinabook.ru/upload/alpina.images/2e3/0aouq2i1gxa9i29m49ate3t4qze0vb0n/65.jpg',
    'https://alpinabook.ru/upload/alpina.images/a9b/fc8oexgeug5n4su1xnb4b70j8i3a6jsj/64.jpg'
  ];
  const IMAGE_DURATION_MS = 1000;      // время показа одной картинки (мс)
  const LOOPS_BEFORE_CLOSE = 2;        // через сколько ПОЛНЫХ кругов показать «Закрыть»

  // --- КОНЕЦ НАСТРОЕК ---

  const passwordInput = document.getElementById('passwordInput');
  const startBtn      = document.getElementById('startBtn');
  const scareScreen   = document.getElementById('scareScreen');
  const scareImage    = document.getElementById('scareImage');
  const closeBtn      = document.getElementById('closeBtn');
  const scaryAudio    = document.getElementById('scaryAudio');

  let currentImageIndex = 0;
  let fullCycles        = 0;
  let imageTimer        = null;

  function showNextImage() {
    // Дошли до конца массива — сбрасываем на начало, считаем круг
    if (currentImageIndex >= IMAGES.length) {
      currentImageIndex = 0;
      fullCycles++;

      // Через N кругов показываем кнопку «Закрыть» (карусель НЕ останавливается)
      if (fullCycles >= LOOPS_BEFORE_CLOSE) {
        closeBtn.style.display = 'block';
      }
    }

    scareImage.src = IMAGES[currentImageIndex];
    currentImageIndex++;

    // И планируем следующую — бесконечно
    imageTimer = setTimeout(showNextImage, IMAGE_DURATION_MS);
  }

  startBtn.addEventListener('click', async () => {
    if (passwordInput.value !== CORRECT_PASSWORD) {
      alert('Неверный пароль!');
      return;
    }

    try { scaryAudio.play(); } catch (e) { console.warn('Звук не запустился:', e); }

    scareScreen.style.display = 'flex';

    try { await scareScreen.requestPointerLock(); } catch (e) { console.warn('Pointer Lock:', e); }

    // Сброс на начало при каждом старте
    currentImageIndex = 0;
    fullCycles        = 0;
    closeBtn.style.display = 'none';
    scareImage.style.display = 'block';
    showNextImage();
  });

  closeBtn.addEventListener('click', () => {
    clearTimeout(imageTimer);
    scaryAudio.pause();
    scaryAudio.currentTime = 0;

    scareScreen.style.display = 'none';
    closeBtn.style.display   = 'none';
    scareImage.style.display = 'block';

    if (document.pointerLockElement) document.exitPointerLock();
  });
